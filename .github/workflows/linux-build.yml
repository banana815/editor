name: Linux build (InstaBox)

on:
  push:
    branches: [main]
    paths:
      - 'test-app/**'
      - '.github/workflows/linux-build.yml'
  pull_request:
    paths:
      - 'test-app/**'
      - '.github/workflows/linux-build.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: Linux build runner (GitHub is the fallback)
        required: true
        type: choice
        default: instabox-medium
        options:
          - instabox-medium
          - ubuntu-24.04

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Tauri Linux x86_64 (.deb)
    runs-on: ${{ inputs.runner || 'instabox-medium' }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Tauri v2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file patchelf \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test-app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: test-app/src-tauri -> target

      - name: Install JavaScript dependencies
        working-directory: test-app
        run: npm ci

      - name: Build Tauri Debian package
        working-directory: test-app
        # Validation builds do not publish signed updater artifacts.
        run: >-
          npm run tauri -- build --bundles deb
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload Linux Debian package
        uses: actions/upload-artifact@v4
        with:
          name: editor-linux-x86_64-deb
          path: test-app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 7
