name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            runner: macos-latest
          - platform: windows-latest
            runner: windows-latest
          - platform: linux-x64
            runner: instabox-medium
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: test-app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Linux only)
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file patchelf \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev

      - name: Install frontend dependencies
        working-directory: test-app
        run: npm ci

      - name: Build and publish the app
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: "./test-app"
          tagName: ${{ github.ref_name }}
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'linux-x64' && '--bundles deb' || '' }}

      - name: Build without publishing (manual runs)
        if: github.event_name == 'workflow_dispatch'
        working-directory: test-app
        shell: bash
        # Manual builds do not receive the release signing secrets.
        run: >-
          npm run tauri -- build ${{ matrix.platform == 'linux-x64' && '--bundles deb' || '' }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload manual build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: editor-${{ matrix.platform }}-manual
          path: |
            test-app/src-tauri/target/release/bundle/**/*.deb
            test-app/src-tauri/target/release/bundle/**/*.dmg
            test-app/src-tauri/target/release/bundle/**/*.msi
            test-app/src-tauri/target/release/bundle/**/*.exe
            test-app/src-tauri/target/release/bundle/**/*.app.tar.gz
          if-no-files-found: error
          retention-days: 7
